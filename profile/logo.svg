<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Vibing Munchies">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <radialGradient id="dough" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fbe3bf"/>
      <stop offset="1" stop-color="#eec08e"/>
    </radialGradient>
    <mask id="bite">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="102" cy="34" r="12" fill="#000"/>
      <circle cx="108" cy="51" r="10" fill="#000"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#background)"/>

  <!-- cookie with a bite taken out -->
  <g mask="url(#bite)">
    <circle cx="64" cy="64" r="42" fill="url(#dough)"/>
    <g fill="#b98e6e" opacity="0.75">
      <circle cx="48" cy="44" r="5"/>
      <circle cx="72" cy="40" r="4"/>
      <circle cx="40" cy="68" r="4.5"/>
      <circle cx="62" cy="62" r="5.5"/>
      <circle cx="84" cy="66" r="4"/>
      <circle cx="54" cy="88" r="4.5"/>
      <circle cx="78" cy="86" r="5"/>
    </g>
  </g>

  <!-- crumbs -->
  <g fill="#eec08e">
    <circle cx="115" cy="66" r="3"/>
    <circle cx="118" cy="50" r="2"/>
    <circle cx="112" cy="78" r="1.8"/>
  </g>

  <!-- sparkles -->
  <g fill="#f9a8d4">
    <path d="M24 15Q24 24 33 24Q24 24 24 33Q24 24 15 24Q24 24 24 15Z"/>
    <path d="M30 98Q30 104 36 104Q30 104 30 110Q30 104 24 104Q30 104 30 98Z"/>
  </g>
</svg>
